        <!-- // =============================================

        <div id="root"></div>


    <script>
        const newEle = React.createElement(
            'h1',
            { id: 'new1' },
            'Hello xin chào (Được tạo bằng createElement)'
        );

        // Lúc này root đã nằm ở trên nên chắc chắn tìm thấy, không lo bị null nữa!
        const container = document.querySelector('#root'); 
        const root = ReactDOM.createRoot(container);

    <script type="text/babel">
        const reactCourse = 'React JS tại F8';

        const ulElement = (
            <ul>
                <li>Bài học: {reactCourse}</li>
                <li>Xin Chào - JSX đã chạy mượt mà!</li>
            </ul>
        );

        // Render ra theo chuẩn React 18 bằng cú pháp JSX
        const containerJsx = document.querySelector('#root');
        const rootJsx = ReactDOM.createRoot(containerJsx);
        rootJsx.render(ulElement);
    </script>
