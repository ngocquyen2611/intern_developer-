<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Members</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4 sm:p-8">
    
    <div class="w-full max-w-4xl bg-white rounded-xl shadow-lg p-6 grid grid-cols-1 md:grid-cols-2 gap-8">
        
        <div class="flex flex-col">
            <h2 class="text-2xl font-bold text-gray-800 mb-4 pb-2 border-b-2 border-blue-500 uppercase tracking-wide">
                Danh sách xin chào
            </h2>
            <ul id="list-members" class="space-y-3 overflow-y-auto max-h-[400px] pr-2"> 
                </ul>
        </div>

        <div class="bg-gray-50 p-5 rounded-lg border border-gray-200 shadow-sm h-fit">
            <h3 class="text-lg font-semibold text-gray-700 mb-4 flex items-center gap-2">
                Thông tin thành viên
            </h3>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Name</label>
                    <input type="text" name="name" placeholder="Nhập tên thành viên..." 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Title</label>
                    <input type="text" name="title" placeholder="Nhập chức danh..." 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all">
                </div>
                
                <div class="pt-2">
                    <button id="create" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-md shadow-sm transition-colors duration-200 uppercase text-sm tracking-wider">
                        Create
                    </button>
                    <button id="update" style="display: none;" 
                        class="w-full bg-green-600 hover:bg-green-700 text-white font-medium py-2.5 px-4 rounded-md shadow-sm transition-colors duration-200 uppercase text-sm tracking-wider">
                        Update
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script src="main.js"></script>
</body>
</html>
